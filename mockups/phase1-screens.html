<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Charming badge pet: Phase 1 screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f1f0ea; --ink:#26251f; --muted:#77736a; --accent:#e8611c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 Inter, system-ui, sans-serif; padding:0; }
  .tag { font:500 11px 'Geist Mono', monospace; letter-spacing:.06em; text-transform:uppercase; color:#8a8a8a; }
  p.lead { margin:0 0 14px; color:var(--muted-foreground); }
  .bar { display:flex; gap:8px; margin-bottom:22px; align-items:center; flex-wrap:wrap; }
  .bar button { font:inherit; color:#26251f; border:1.5px solid #26251f; background:#fdfdfb; border-radius:999px; padding:6px 14px; cursor:pointer; }
  .bar button[aria-pressed="true"] { background:var(--accent); color:var(--ink); border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  figure { margin:0; color:#f0f0f0; background:#111; border:1px solid #2a2a2a; border-radius:20px; padding:18px; }
  .bezel { width:198px; height:198px; margin:0 auto; border-radius:50%; background:#1c1c1c; padding:7px; box-shadow:inset 0 0 0 1px #3a3a3a; }
  canvas { width:184px; height:184px; border-radius:50%; display:block; cursor:pointer; }
  figcaption { margin-top:14px; }
  figcaption b { display:block; font:italic 400 21px 'Instrument Serif', serif; }
  figcaption span { color:#b5b5b4; font-size:13.5px; }
</style>
</head>
<body>
<p class="lead">Revised: black AMOLED, heyclicky type (Instrument Serif, Inter, Geist Mono), and only the mascot is Charming. When the pet shows something, it hops down to the bottom of the circle so nothing covers it. Click a screen to poke it.</p>
<div class="grid" id="grid"></div>

<svg width="0" height="0" style="position:absolute">
  <path id="flame" d="M279.074,42.499C293.511,41.019 290.884,62.572 310.836,81.573C330.787,100.574 343.84,93.301 354.993,120.442C366.145,147.583 338.821,194.392 352.874,212.728C366.927,231.065 384.574,217.078 400.03,249.102C415.486,281.126 395.274,304.778 388.646,329.136C382.018,353.493 400.205,369.389 375.503,406.793C350.801,444.197 292.874,454.488 256.231,459.455C219.589,464.423 170.001,437.843 141.445,406.802C112.888,375.762 104.898,336.966 106.798,321.724C108.698,306.482 113.311,309.537 120.792,299.483C128.272,289.429 116.02,272.216 116.324,256C116.628,239.784 118.081,229.9 130.308,207.118C142.536,184.336 150.074,211.818 165.021,192.432C174.269,180.436 178.045,153.463 185.098,138.152C192.152,122.841 199.917,118.801 207.881,119.485C215.844,120.169 219.284,127.766 229.084,122.707C238.884,117.648 248.227,99.435 255.21,78.546C262.193,57.657 267.462,43.69 279.074,42.499Z"/>
  <path id="hl" d="M289,109C291.405,115.002 296.224,116.345 302,118C307.776,119.655 314.584,123.498 318,129.55C321.416,135.603 323.353,139.878 322.472,149.109"/>
</svg>

<script>
const N = 72, S = 466;
const CORAL = '#f77448', INK = '#151410', CREAM = '#fbf0d9', ACCENT = '#e8611c';
function sample(id, n, closed) {
  const p = document.getElementById(id), L = p.getTotalLength(), out = [];
  for (let i = 0; i < n; i++) { const q = p.getPointAtLength(L * i / (closed ? n : n - 1)); out.push([q.x, q.y]); }
  return out;
}
const REST = sample('flame', N, true), HL = sample('hl', 10, false);
const bg = 'black';
const SERIF = "'Instrument Serif', serif", SANS = "Inter, system-ui, sans-serif", MONO = "'Geist Mono', monospace";
const UI = '#f0f0f0', DIM = '#8a8a8a', TRACK = '#262626', LOW = '#ff5a4f';

const SCENES = [
  { key:'idle',  title:'Idle', note:'Breathes, the flame tip flickers, it blinks and looks around. Rim arcs show FOOD, ENERGY and JOY.' },
  { key:'happy', title:'Happy (just petted)', note:'Eyes curve into ^ ^ with blush. Bounces, and the motor gives a short purr.' },
  { key:'hungry',title:'Hungry', note:'Looks up at a bowl, a small "o" mouth, with impatient hops. The FOOD arc runs low and turns red.' },
  { key:'sick',  title:'Sick', note:'Droops and loses color, with a sweat drop and squiggle mouth. Needs medicine, or it eventually runs away.' },
  { key:'sleep', title:'Sleeping', note:'Closed eyes, slow breathing, floating Zs. The screen dims to save battery.' },
  { key:'menu',  title:'Care menu', note:'Touch or press B. Actions sit along the rim in mono type. A cycles, B picks.' },
  { key:'card',  title:'Name tag', note:'The mascot hops to the bottom and your name takes the top half. Nothing overlaps it.' },
  { key:'qr',    title:'Shown by the AI (Phase 2+)', note:'Same layout, fed by the brain: a QR code for the app it just made, a next meeting, a short answer.' },
  { key:'gone',  title:'Ran away', note:'After long neglect. Footprints and a note. Hold A to call it back, then win it over with treats.' },
];

const grid = document.getElementById('grid');
const pets = SCENES.map(sc => {
  const fig = document.createElement('figure');
  fig.innerHTML = `<div class="bezel"><canvas width="${S}" height="${S}"></canvas></div><figcaption><b>${sc.title}</b><span>${sc.note}</span></figcaption>`;
  grid.appendChild(fig);
  const cv = fig.querySelector('canvas');
  const pet = { sc, ctx: cv.getContext('2d'), off: REST.map(() => [0,0]), vel: REST.map(() => [0,0]), seed: 1, lookX:0, lookY:0, tx:0, ty:0, nextLook:0, nextBlink: 1000 + Math.random()*2000, blinkT:-1, hop:0 };
  cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width * S, my = (e.clientY - r.top) / r.height * S;
    pet.off.forEach((_, i) => {
      const [x, y] = toScreen(pet, REST[i]);
      const d = Math.hypot(x - mx, y - my); const k = Math.max(0, 1 - d / 160);
      pet.vel[i][0] += (x - mx) / (d || 1) * 22 * k; pet.vel[i][1] += (y - my) / (d || 1) * 22 * k;
    });
    pet.hop = 1;
  });
  return pet;
});

function layout(pet) {
  const k = pet.sc.key;
  if (k === 'card' || k === 'qr') return { s: 0.3, cx: 233, cy: 378 };
  if (k === 'menu') return { s: 0.5, cx: 233, cy: 238 };
  return { s: 0.6, cx: 233, cy: 245 };
}
function toScreen(pet, [x, y]) { const L = layout(pet); return [L.cx + (x - 256) * L.s, L.cy + (y - 256) * L.s]; }

function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function step(pet, t, dt) {
  const k = pet.sc.key;
  // springs back to rest
  for (let i = 0; i < N; i++) {
    const o = pet.off[i], v = pet.vel[i];
    v[0] += -o[0] * 0.18; v[1] += -o[1] * 0.18; v[0] *= 0.86; v[1] *= 0.86;
    o[0] += v[0]; o[1] += v[1];
  }
  pet.hop *= 0.92;
  if (t > pet.nextLook) { pet.tx = (Math.random() - .5) * 14; pet.ty = (Math.random() - .5) * 8; pet.nextLook = t + 900 + Math.random() * 1800; }
  if (k === 'hungry') { pet.tx = Math.sin(t / 700) * 4; pet.ty = -9; }
  if (k === 'card' || k === 'qr') { pet.tx = 0; pet.ty = -12; }
  pet.lookX += (pet.tx - pet.lookX) * 0.12; pet.lookY += (pet.ty - pet.lookY) * 0.12;
  if (t > pet.nextBlink && pet.blinkT < 0) pet.blinkT = 0;
  if (pet.blinkT >= 0) { pet.blinkT += dt; if (pet.blinkT > 160) { pet.blinkT = -1; pet.nextBlink = t + 2200 + Math.random() * 3000; } }
  if (Math.floor(t / 110) !== pet.boilFrame) { pet.boilFrame = Math.floor(t / 110); pet.seed = pet.boilFrame % 9973 + 7; }
}

function deform(pet, [x, y], i, t) {
  const k = pet.sc.key;
  let br = Math.sin(t / (k === 'sleep' ? 1400 : 650)) * (k === 'sleep' ? 0.035 : 0.022);
  let sx = 1 - br * 0.6, sy = 1 + br;
  let hopY = 0;
  if (k === 'happy') { const b = Math.abs(Math.sin(t / 230)); hopY = -b * 22; sy += (b < 0.25 ? -0.08 : 0.03); sx += (b < 0.25 ? 0.06 : -0.02); }
  if (k === 'hungry') { const b = Math.max(0, Math.sin(t / 180)) * (Math.sin(t / 1300) > 0.3 ? 1 : 0); hopY = -b * 12; }
  if (k === 'sick') { sy *= 0.9; sx *= 1.07; }
  hopY -= pet.hop * 10;
  let nx = 256 + (x - 256) * sx, ny = 459 + (y - 459) * sy + hopY;
  if (y < 170) { const w = (170 - y) / 128; nx += Math.sin(t / 160 + y / 30) * 7 * w * (k === 'sleep' ? 0.3 : k === 'sick' ? 0.15 : 1); if (k === 'sick') nx += w * w * 26; }
  const r = rand(pet.seed * 131 + i * 17); nx += (r() - .5) * 2.2; ny += (r() - .5) * 2.2;
  return [nx + pet.off[i][0], ny + pet.off[i][1]];
}

function smooth(ctx, pts, closed) {
  const n = pts.length;
  ctx.beginPath();
  if (closed) {
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    let s = m(pts[n - 1], pts[0]); ctx.moveTo(s[0], s[1]);
    for (let i = 0; i < n; i++) { const e = m(pts[i], pts[(i + 1) % n]); ctx.quadraticCurveTo(pts[i][0], pts[i][1], e[0], e[1]); }
    ctx.closePath();
  } else { ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(pts[i][0], pts[i][1]); }
}

function drawMascot(pet, t) {
  const { ctx } = pet, k = pet.sc.key, L = layout(pet);
  const pts = REST.map((p, i) => deform(pet, p, i, t));
  const scr = pts.map(([x, y]) => [L.cx + (x - 256) * L.s, L.cy + (y - 256) * L.s]);
  ctx.save();
  // ground shadow
  ctx.fillStyle = bg === 'paper' ? 'rgba(38,37,31,.12)' : 'rgba(255,255,255,.08)';
  ctx.beginPath(); ctx.ellipse(L.cx, L.cy + 206 * L.s, 120 * L.s, 14 * L.s, 0, 0, Math.PI * 2); ctx.fill();
  smooth(ctx, scr, true);
  ctx.fillStyle = k === 'sick' ? '#d99a7a' : CORAL; ctx.fill();
  ctx.lineWidth = 12 * L.s * 1.15; ctx.lineJoin = 'round'; ctx.strokeStyle = INK;
  if (bg === 'black') { ctx.strokeStyle = '#151410'; }
  ctx.stroke();
  if (bg === 'black') { ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(251,240,217,.35)'; smooth(ctx, scr.map(([x,y]) => [x,y]), true); ctx.stroke(); }
  // highlight follows nearest body motion roughly
  const hl = HL.map(([x, y], i) => { const d = deform(pet, [x, y], (i * 7) % N, t); return [L.cx + (d[0] - 256) * L.s, L.cy + (d[1] - 256) * L.s]; });
  if (k !== 'sick') { ctx.lineWidth = 12 * L.s; ctx.lineCap = 'round'; ctx.strokeStyle = CREAM; smooth(ctx, hl, false); ctx.stroke(); }
  // face anchor follows body center deformation
  const fc = deform(pet, [260, 268], 0, t);
  const fx = L.cx + (fc[0] - 256) * L.s, fy = L.cy + (fc[1] - 256) * L.s;
  drawFace(pet, ctx, fx + pet.lookX * L.s * 1.6, fy + pet.lookY * L.s * 1.6, L.s, t);
  ctx.restore();
}

function drawFace(pet, ctx, x, y, s, t) {
  const k = pet.sc.key, ex = 21 * s * 1.0, lw = 18 * s;
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineCap = 'round'; ctx.lineWidth = lw;
  const blinking = pet.blinkT >= 0;
  const eye = (cx) => {
    if (k === 'happy') { ctx.lineWidth = lw * 0.7; ctx.beginPath(); ctx.arc(cx, y + 6 * s, 11 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); return; }
    if (k === 'sleep') { ctx.lineWidth = lw * 0.6; ctx.beginPath(); ctx.arc(cx, y - 4 * s, 10 * s, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); return; }
    if (k === 'sick') { ctx.lineWidth = lw * 0.7; ctx.beginPath(); ctx.moveTo(cx - 9 * s, y + 2 * s); ctx.lineTo(cx + 9 * s, y + 6 * s); ctx.stroke(); return; }
    const h = blinking ? 0.5 : (k === 'hungry' ? 18 : 13) * s;
    ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(cx, y - h / 2); ctx.lineTo(cx, y + h / 2); ctx.stroke();
  };
  eye(x - ex); eye(x + ex);
  ctx.lineWidth = lw * 0.5;
  if (k === 'happy') { ctx.fillStyle = 'rgba(232,97,28,.55)'; [-1, 1].forEach(d => { ctx.beginPath(); ctx.ellipse(x + d * 44 * s, y + 22 * s, 13 * s, 7 * s, 0, 0, Math.PI * 2); ctx.fill(); }); ctx.beginPath(); ctx.arc(x, y + 22 * s, 10 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  if (k === 'hungry') { ctx.beginPath(); ctx.ellipse(x, y + 32 * s, 7 * s, 9 * s + Math.sin(t / 200) * 2 * s, 0, 0, Math.PI * 2); ctx.stroke(); }
  if (k === 'sick') { ctx.beginPath(); for (let i = 0; i <= 6; i++) { const px = x - 18 * s + i * 6 * s, py = y + 30 * s + (i % 2 ? 4 : -4) * s; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke();
    ctx.fillStyle = '#7fb7e6'; const dy = (t / 25) % 40; ctx.beginPath(); ctx.ellipse(x + 62 * s, y - 40 * s + dy * s, 7 * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill(); }
}

function rimStats(ctx, vals) {
  const names = ['FOOD', 'ENERGY', 'JOY'];
  vals.forEach((v, i) => {
    const a0 = Math.PI * (0.64 + i * 0.26), span = Math.PI * 0.2;
    ctx.lineCap = 'round'; ctx.lineWidth = 6;
    ctx.strokeStyle = TRACK; ctx.beginPath(); ctx.arc(233, 233, 218, a0, a0 + span); ctx.stroke();
    ctx.strokeStyle = v < 0.25 ? LOW : UI; ctx.beginPath(); ctx.arc(233, 233, 218, a0, a0 + span * v); ctx.stroke();
    const am = a0 + span / 2, lx = 233 + Math.cos(am) * 196, ly = 233 + Math.sin(am) * 196;
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(am + Math.PI / 2); ctx.fillStyle = v < 0.25 ? LOW : DIM; ctx.font = `500 11px ${MONO}`; ctx.textAlign = 'center'; ctx.fillText(names[i], 0, 4); ctx.restore();
  });
}

function bubble(ctx, x, y, r, draw) {
  ctx.strokeStyle = DIM; ctx.lineWidth = 2.5; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x - r * 0.9, y + r * 1.1, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  draw();
}

function card(ctx, t, kind) {
  ctx.textAlign = 'center';
  if (kind === 'card') {
    ctx.fillStyle = DIM; ctx.font = `500 13px ${MONO}`; ctx.fillText('HELLO, I’M', 233, 118);
    ctx.fillStyle = UI; ctx.font = `italic 400 74px ${SERIF}`; ctx.fillText('Akhilesh', 233, 196);
    ctx.fillStyle = '#b5b5b4'; ctx.font = `400 19px ${SANS}`; ctx.fillText('Engineer at Charming', 233, 236);
    ctx.fillStyle = DIM; ctx.font = `500 11px ${MONO}`; ctx.fillText('B  BACK', 233, 272);
  } else {
    ctx.fillStyle = UI; ctx.font = `italic 400 30px ${SERIF}`; ctx.fillText('I made your app', 233, 76);
    const q = 138, qx = 233 - q / 2, qy = 96, r = rand(42), cell = q / 21;
    ctx.fillStyle = '#fff'; roundRect(ctx, qx - 10, qy - 10, q + 20, q + 20, 12); ctx.fill();
    ctx.fillStyle = '#000';
    for (let i = 0; i < 21; i++) for (let j = 0; j < 21; j++) {
      const finder = (a, b) => (a < 7 && b < 7) || (a > 13 && b < 7) || (a < 7 && b > 13);
      let on;
      if (finder(i, j)) { const ci = i > 13 ? i - 14 : i, cj = j > 13 ? j - 14 : j; on = ci === 0 || ci === 6 || cj === 0 || cj === 6 || (ci > 1 && ci < 5 && cj > 1 && cj < 5); }
      else on = r() > 0.52;
      if (on) ctx.fillRect(qx + i * cell, qy + j * cell, cell + 0.4, cell + 0.4);
    }
    ctx.fillStyle = DIM; ctx.font = `500 12px ${MONO}`; ctx.fillText('charm.ing/a/tip-splitter', 233, 268);
  }
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function menu(ctx, t) {
  const items = ['FEED', 'PLAY', 'CLEAN', 'MEDS', 'LIGHTS'], sel = Math.floor(t / 1200) % items.length;
  items.forEach((name, i) => {
    const a = Math.PI * (1.12 + i * 0.19), x = 233 + Math.cos(a) * 178, y = 233 + Math.sin(a) * 178;
    const on = i === sel;
    ctx.font = `500 13px ${MONO}`; const w = ctx.measureText(name).width + 22;
    if (on) { ctx.fillStyle = UI; roundRect(ctx, x - w / 2, y - 14, w, 28, 14); ctx.fill(); }
    ctx.fillStyle = on ? '#000' : DIM; ctx.textAlign = 'center'; ctx.fillText(name, x, y + 4.5);
  });
  ctx.fillStyle = DIM; ctx.font = `500 11px ${MONO}`; ctx.textAlign = 'center'; ctx.fillText('A  NEXT     B  PICK', 233, 440);
}

function scene(pet, t) {
  const { ctx } = pet, k = pet.sc.key;
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = bg === 'paper' ? '#f1f0ea' : '#000'; ctx.fillRect(0, 0, S, S);
  if (k === 'gone') {
    ctx.fillStyle = bg === 'paper' ? 'rgba(38,37,31,.35)' : 'rgba(255,255,255,.3)';
    for (let i = 0; i < 7; i++) { const x = 90 + i * 46, y = 330 - Math.sin(i * 0.9) * 26 + (i % 2 ? 12 : -12); ctx.beginPath(); ctx.ellipse(x, y, 9, 6, 0.3, 0, Math.PI * 2); ctx.fill(); }
    ctx.textAlign = 'center'; ctx.fillStyle = UI; ctx.font = `italic 400 40px ${SERIF}`;
    ctx.fillText('gone exploring.', 233, 182); ctx.fillText('come find me?', 233, 226);
    ctx.fillStyle = DIM; ctx.font = `500 12px ${MONO}`; ctx.fillText('HOLD A TO CALL', 233, 268);
    return;
  }
  if (k === 'sleep') ctx.globalAlpha = 0.6;
  drawMascot(pet, t);
  ctx.globalAlpha = 1;
  if (k === 'idle') rimStats(ctx, [0.7, 0.55, 0.85]);
  if (k === 'happy') { rimStats(ctx, [0.7, 0.55, 1]); ctx.fillStyle = UI; [[120, 120], [345, 140], [330, 90]].forEach(([x, y], i) => { const s = 6 + Math.sin(t / 200 + i) * 3; ctx.beginPath(); ctx.moveTo(x, y - s * 2); ctx.lineTo(x + s * .5, y - s * .5); ctx.lineTo(x + s * 2, y); ctx.lineTo(x + s * .5, y + s * .5); ctx.lineTo(x, y + s * 2); ctx.lineTo(x - s * .5, y + s * .5); ctx.lineTo(x - s * 2, y); ctx.lineTo(x - s * .5, y - s * .5); ctx.closePath(); ctx.fill(); }); }
  if (k === 'hungry') { rimStats(ctx, [0.12, 0.6, 0.5]); bubble(ctx, 350, 105, 42, () => { ctx.strokeStyle = UI; ctx.lineWidth = 3; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(350, 105, 22, 0, Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#000'; [[-8, 0], [0, -6], [8, 0]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(350 + dx, 102 + dy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }); }); }
  if (k === 'sick') rimStats(ctx, [0.4, 0.2, 0.18]);
  if (k === 'sleep') { ctx.fillStyle = DIM; ctx.textAlign = 'left'; for (let i = 0; i < 3; i++) { const p = ((t / 2400) + i / 3) % 1; ctx.globalAlpha = Math.sin(p * Math.PI); ctx.font = `italic 400 ${22 + p * 26}px ${SERIF}`; ctx.fillText('z', 300 + p * 50 + Math.sin(p * 8) * 6, 160 - p * 90); } ctx.globalAlpha = 1; }
  if (k === 'menu') menu(ctx, t);
  if (k === 'card' || k === 'qr') card(ctx, t, k);
}

let last = performance.now();
function frame(t) {
  const dt = Math.min(50, t - last); last = t;
  pets.forEach(p => { step(p, t, dt); scene(p, t); });
  requestAnimationFrame(frame);
}
Promise.all([document.fonts.load('500 13px "Geist Mono"'), document.fonts.load('italic 40px "Instrument Serif"'), document.fonts.load('400 19px Inter')]).finally(() => requestAnimationFrame(frame));

</script>
</body>
</html>
